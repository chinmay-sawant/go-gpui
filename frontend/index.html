<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ownframe: HTML and CSS screens with Go application logic. Watch the demos and read the documentation." />
    <script>
      try {
        const theme = localStorage.getItem('ownframe:theme') || localStorage.getItem('go-gpui:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>ownframe | HTML screens, Go logic</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
