<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>History</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #f4f1ea; font-family: sans-serif; color: #1c1915; }
  .card { width: 380px; background: #ffffff; padding: 24px; margin: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 13px; min-height: 18px; margin: 0 0 8px; }
  #status { color: #176b45; }
  .bar {
    display: block;
    background: #e5e7eb;
    border: 1px solid #c8c2b4;
    padding: 8px;
    margin-top: 8px;
    text-align: center;
  }
  #red, #green, #native { background: #1a56db; color: #ffffff; }
</style>
</head>
<body>
  <div id="card" class="card">
    <h1>History</h1>
    <p id="status">{{.Status}}</p>
    <div id="red" class="bar" data-action="red">Red route</div>
    <div id="green" class="bar" data-action="green">Green route</div>
    <div id="native" class="bar">Native load</div>
    <div id="back" class="bar">Back</div>
    <div id="forward" class="bar">Forward</div>
  </div>
</body>
</html>
