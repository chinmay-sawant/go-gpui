<header class="topbar">
  <div class="title">Settings</div>
</header>
<main class="list settings">
  <div class="setrow">
    <div class="setbody">
      <span class="setname">Dark mode</span>
      <span class="sethint">The Telegram night look</span>
    </div>
    <input id="dark" class="toggle" type="checkbox" data-bind="Dark">
  </div>
  <div class="setrow">
    <div class="setbody">
      <span class="setname">Version</span>
      <span class="sethint">ownframe Telegram demo</span>
    </div>
    <span class="setvalue">0.0.2</span>
  </div>
  <div class="setnote">
    One HTML template, drawn by ownframe: the chat list, contacts, settings,
    and one conversation. Soft keyboard and system bars are wired for the
    phone build.
  </div>
</main>
