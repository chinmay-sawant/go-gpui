// Top-level build file. The Android Gradle plugin version is pinned to the one
// the Ebitengine docs and go-inovation use with a current ebitenmobile AAR.
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
