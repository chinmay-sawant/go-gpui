<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #f4f1ea;
    font-family: sans-serif;
    color: #1c1915;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card { width: 320px; background: #ffffff; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .error { color: #9b2335; font-size: 13px; min-height: 18px; margin: 0; }
  .status { color: #176b45; font-size: 13px; min-height: 18px; margin: 0; }
  .field.is-selected { background: #d6e2ff; }
  label { display: block; font-size: 13px; margin-top: 12px; }
  .field {
    display: block;
    border: 1px solid #c8c2b4;
    padding: 8px;
    margin-top: 4px;
    min-height: 18px;
  }
  .field.is-focus { border: 2px solid #1a56db; padding: 7px; }
  #login {
    display: block;
    margin-top: 16px;
    background: #1a56db;
    color: #ffffff;
    padding: 10px;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="card" class="card">
    <h1>Sign in</h1>
    <p id="message" class="{{if .Status}}status{{else}}error{{end}}">{{if .Status}}{{.Status}}{{else}}{{.Error}}{{end}}</p>
    <label>Email</label>
    <div id="email" class="field{{if eq .Focus "email"}} is-focus{{end}}{{if and (eq .Focus "email") .Selected}} is-selected{{end}}" data-action="focus">{{.Email}}</div>
    <label>Password</label>
    <div id="password" class="field{{if eq .Focus "password"}} is-focus{{end}}{{if and (eq .Focus "password") .Selected}} is-selected{{end}}" data-action="focus">{{.PasswordMask}}</div>
    <div id="login" data-action="login">Sign in</div>
  </div>
</body>
</html>
