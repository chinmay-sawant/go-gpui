<section id="card-wpm" class="card stat">
  <p class="stat-value">{{.WPM.Value}}</p>
  <p class="stat-label">Words per minute <img class="info" src="icon-info"></p>
  <div class="gauge">
    <img class="gauge-arc" src="gauge">
    <div class="gauge-text"><span class="gauge-top">Top</span><span class="gauge-pct">{{.WPM.Top}}</span></div>
  </div>
</section>
