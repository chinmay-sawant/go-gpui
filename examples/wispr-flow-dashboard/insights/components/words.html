<section id="card-words" class="card stat">
  <span class="delta"><span class="delta-icon"></span>{{.Words.Delta}}</span>
  <p class="stat-value">{{.Words.Value}}</p>
  <p class="stat-label">Total words dictated</p>
  <div class="rule"></div>
  <div class="words-row">
    <div class="words-left">
      <div class="app-line"><img class="app-icon" src="icon-desktop">Desktop</div>
      <div class="app-count">{{.Words.Desktop}}</div>
    </div>
    <button id="download" class="button">Download on mobile</button>
  </div>
</section>
