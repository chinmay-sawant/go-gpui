<div id="get-app-modal" class="getapp">
  <div class="getapp-panel">
    <div class="getapp-head">
      <span class="getapp-title">Flow on mobile</span>
      <span id="get-app-close" class="icon-btn" data-action="get-app-close"><img src="icon-close"></span>
    </div>
    <img class="getapp-qr" src="qr-code">
    <p class="getapp-text">Scan the QR code with your phone camera to download Flow for iPhone or Android.</p>
    <div class="getapp-stores">
      <button id="get-app-appstore" class="btn getapp-store" data-action="get-app-store">App Store</button>
      <button id="get-app-googleplay" class="btn getapp-store" data-action="get-app-store">Google Play</button>
    </div>
  </div>
</div>
