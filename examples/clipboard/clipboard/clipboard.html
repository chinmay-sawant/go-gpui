<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Clipboard</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #f4f1ea;
    font-family: sans-serif;
    color: #1c1915;
  }
  .card { width: 460px; background: #ffffff; padding: 24px; margin: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #status { color: #176b45; font-size: 13px; min-height: 18px; margin: 0; }
  label { display: block; font-size: 13px; margin-top: 12px; }
  #left, #right {
    display: block;
    border: 1px solid #c8c2b4;
    padding: 8px;
    margin-top: 4px;
    min-height: 18px;
    width: 320px;
  }
  .row { margin-top: 16px; }
  .btn {
    display: inline-block;
    background: #1a56db;
    color: #ffffff;
    font-size: 13px;
    padding: 8px 10px;
    margin-right: 6px;
  }
</style>
</head>
<body>
  <div id="card" class="card">
    <h1>Clipboard</h1>
    <p id="status">{{.Status}}</p>
    <label>Left</label>
    <input id="left" type="text">
    <label>Right</label>
    <input id="right" type="text">
    <div class="row">
      <div id="copy" class="btn">Copy</div>
      <div id="cut" class="btn">Cut</div>
      <div id="selectall" class="btn">Select all</div>
    </div>
    <div class="row">
      <div id="pastego" class="btn">Paste Go text</div>
      <div id="undo" class="btn">Undo</div>
      <div id="redo" class="btn">Redo</div>
    </div>
  </div>
</body>
</html>
