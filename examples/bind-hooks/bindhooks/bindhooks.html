<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bind hooks</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #f4f1ea;
    font-family: sans-serif;
    color: #1c1915;
  }
  .card { width: 380px; background: #ffffff; padding: 24px; margin: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #state { font-size: 13px; min-height: 18px; margin: 0; }
  #status { color: #176b45; font-size: 13px; min-height: 18px; margin: 0; }
  label { display: block; font-size: 13px; margin-top: 12px; }
  #name, #email {
    display: block;
    border: 1px solid #c8c2b4;
    padding: 8px;
    margin-top: 4px;
    min-height: 18px;
    width: 280px;
  }
  #agree, #free, #pro { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div id="card" class="card">
    <h1>Bind hooks</h1>
    <p id="state">{{.Name}} | {{.Email}} | {{.Agree}} | {{.Plan}}</p>
    <p id="status">{{.Status}}</p>
    <label>Name (locked)</label>
    <input id="name" type="text" data-bind="Name">
    <label>Email</label>
    <input id="email" type="text" data-bind="Email">
    <label>Agree</label>
    <input id="agree" type="checkbox" data-bind="Agree">
    <label>Free</label>
    <input id="free" type="radio" name="plan" value="free" data-bind="Plan">
    <label>Pro</label>
    <input id="pro" type="radio" name="plan" value="pro" data-bind="Plan">
  </div>
</body>
</html>
