<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Controls</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #f4f1ea;
    font-family: sans-serif;
    color: #1c1915;
  }
  .card { width: 380px; background: #ffffff; padding: 24px; margin: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #status { color: #176b45; font-size: 13px; min-height: 18px; margin: 0; }
  label { display: block; font-size: 13px; margin-top: 12px; }
  #name, #bio, #color, #doc {
    display: block;
    border: 1px solid #c8c2b4;
    padding: 8px;
    margin-top: 4px;
    min-height: 18px;
    width: 280px;
  }
  #bio { min-height: 40px; }
  #agree, #free, #pro { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div id="card" class="card">
    <h1>Controls</h1>
    <p id="status">{{.Status}}</p>
    <label>Name</label>
    <input id="name" type="text">
    <label>Bio</label>
    <textarea id="bio"></textarea>
    <label>Agree</label>
    <input id="agree" type="checkbox">
    <label>Free</label>
    <input id="free" type="radio" name="plan" value="free">
    <label>Pro</label>
    <input id="pro" type="radio" name="plan" value="pro">
    <label>Color</label>
    <select id="color">
      <option value="red" selected>Red</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
    </select>
    <label>Doc</label>
    <input id="doc" type="file">
  </div>
</body>
</html>
