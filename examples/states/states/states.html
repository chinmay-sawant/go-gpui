<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS states</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #f4f1ea; font-family: sans-serif; color: #1c1915; }
  .card { width: 380px; background: #ffffff; padding: 24px; margin: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #status { color: #176b45; font-size: 13px; min-height: 18px; margin: 0; }
  .ctl {
    display: block;
    width: 280px;
    padding: 10px;
    margin-top: 12px;
    background: #e5e7eb;
    text-align: center;
  }
  #hover-btn:hover { background: #1a56db; color: #ffffff; }
  #press-btn:active { background: #b91c1c; color: #ffffff; }
  #focus-input {
    display: block;
    border: 1px solid #c8c2b4;
    padding: 8px;
    margin-top: 12px;
    min-height: 18px;
    width: 280px;
  }
  #focus-input:focus { border: 1px solid #1a56db; outline: 1px solid #1a56db; }
  #focus-input:focus-visible { outline: 2px solid #1a56db; }
  label { display: block; font-size: 13px; margin-top: 12px; }
  #agree { width: 18px; height: 18px; }
  #agree:checked { outline: 3px solid #176b45; }
</style>
</head>
<body>
  <div id="card" class="card">
    <h1>CSS states</h1>
    <p id="status">{{.Status}}</p>
    <div id="hover-btn" class="ctl">Hover me</div>
    <div id="press-btn" class="ctl">Press me</div>
    <label>Focus</label>
    <input id="focus-input" type="text" value="">
    <label>Agree</label>
    <input id="agree" type="checkbox">
  </div>
</body>
</html>
