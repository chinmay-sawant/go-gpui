<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LG remote</title>
<style>
  html, body { margin: 0; background: var(--bg, #101010); color: var(--ink, #f2f2f2); }
  body { font-family: sans-serif; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 16px 14px 28px; }
  .top { display: flex; align-items: flex-start; }
  .grow { flex: 1; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; }
  .status { color: var(--muted, #9a9a9a); font-size: 13px; margin: 6px 0 0; min-height: 18px; }
  .hint { color: var(--muted, #9a9a9a); font-size: 12px; margin: 8px 0 0; }
  .row { display: flex; }
  #host {
    flex: 1;
    border: 1px solid var(--line, #343438);
    background: var(--key, #242426);
    color: var(--ink, #f2f2f2);
    padding: 12px;
    margin: 14px 8px 0 0;
  }
  .keys { display: flex; flex-wrap: wrap; margin-top: 8px; }
  .key {
    width: 31%;
    margin: 1%;
    padding: 14px 0;
    text-align: center;
    background: var(--key, #242426);
    color: var(--ink, #f2f2f2);
    border-radius: 8px;
    box-sizing: border-box;
  }
  .slim { width: 72px; margin: 0; padding: 10px 0; }
  .wide { width: 98%; }
  .go { width: 28%; margin: 14px 0 0; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted, #9a9a9a); margin: 16px 0 0; }
  .c-red { background: #8f2d2d; color: #fff; }
  .c-green { background: #2d6a45; color: #fff; }
  .c-yellow { background: #8a6a22; color: #fff; }
  .c-blue { background: #2a4f86; color: #fff; }
  #power { background: var(--power, #c43838); color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="grow">
        <h1>{{.Title}}</h1>
        <p class="status">{{.Status}}</p>
      </div>
      <div id="theme" class="key slim">{{.ThemeLabel}}</div>
    </div>
    <p class="hint">{{.Hint}}</p>
    <div class="row">
      <input id="host" type="text">
      <div id="connect" class="key go">Connect</div>
      <div id="scan" class="key go">Scan</div>
    </div>
    {{if .ShowBluetooth}}
    <div id="mode" class="key wide">{{.Mode}}</div>
    {{end}}
    <div class="keys">
      {{range .Face}}
      <div id="{{.ID}}" class="key {{.Class}}">{{.Label}}</div>
      {{end}}
    </div>
    <h2>More</h2>
    <div class="keys">
      {{range .More}}
      <div id="{{.ID}}" class="key {{.Class}}">{{.Label}}</div>
      {{end}}
    </div>
  </div>
</body>
</html>
