<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Editing</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #f4f1ea;
    font-family: sans-serif;
    color: #1c1915;
  }
  .card { width: 380px; background: #ffffff; padding: 24px; margin: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #stamp { font-size: 13px; margin: 0 0 8px; }
  #status { color: #176b45; font-size: 13px; min-height: 18px; margin: 0 0 8px; }
  label { display: block; font-size: 13px; margin-top: 12px; }
  #note {
    display: block;
    border: 1px solid #c8c2b4;
    padding: 8px;
    margin-top: 4px;
    min-height: 18px;
    width: 300px;
  }
  .btn {
    display: block;
    margin-top: 10px;
    background: #1a56db;
    color: #ffffff;
    padding: 8px;
    width: 140px;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="card" class="card">
    <h1>Editing</h1>
    <p id="stamp">stamp={{.Stamp}}</p>
    <p id="status">{{.Status}}</p>
    <label>Note</label>
    <input id="note" type="text">
    <div id="selectall" class="btn">Select all</div>
    <div id="undo" class="btn">Undo</div>
    <div id="redo" class="btn">Redo</div>
    <div id="redraw" class="btn">Redraw</div>
  </div>
</body>
</html>
