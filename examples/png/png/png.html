<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PNG</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #f4f1ea; font-family: sans-serif; color: #1c1915; }
  .card {
    width: 380px;
    background: #ffffff;
    border: 1px solid #d8d2c6;
    padding: 20px;
    margin: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  #stamp { font-size: 28px; color: #1a56db; margin: 0 0 14px; }
  button { padding: 8px 12px; margin-right: 8px; }
  #status { color: #176b45; font-size: 13px; min-height: 18px; margin: 12px 0 0; }
</style>
</head>
<body>
  <div id="card" class="card">
    <h1 id="title">PNG on demand</h1>
    <p id="stamp">stamp {{.Stamp}}</p>
    <button id="redraw">Redraw</button>
    <button id="save">Save PNG</button>
    <p id="status">{{.Status}}</p>
  </div>
</body>
</html>
